name: Feature request
description: Propose a focused improvement to Charta
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful solution and its keyboard interaction.
    validations:
      required: true
  - type: dropdown
    id: database
    attributes:
      label: Database scope
      options:
        - All supported databases
        - PostgreSQL
        - Microsoft SQL Server
        - SQLite
        - Not database-specific
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I would be willing to help implement or test this feature.
