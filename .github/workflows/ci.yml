name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COVERAGE_THRESHOLD: "50.0"

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run unit tests in randomized order
        run: go test -shuffle=on ./...

  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Download and verify modules
        run: |
          go mod download
          go mod verify

      - name: Check that go.mod and go.sum are tidy
        run: go mod tidy -diff

      - name: Run go vet
        run: go vet ./...

      - name: Run tests with race detection and coverage
        run: go test -race -shuffle=on -covermode=atomic -coverprofile=coverage.out ./...

      - name: Enforce total coverage floor
        shell: bash
        run: |
          set -euo pipefail
          coverage_output="$(go tool cover -func=coverage.out)"
          printf '%s\n' "$coverage_output" | tee coverage.txt
          total="$(printf '%s\n' "$coverage_output" | awk '/^total:/ {gsub(/%/, "", $3); print $3}')"

          if [[ -z "$total" ]]; then
            echo "Could not parse total coverage" >&2
            exit 1
          fi

          {
            echo "## Go coverage"
            echo
            echo "Total statement coverage: **${total}%**"
            echo "Required floor: **${COVERAGE_THRESHOLD}%**"
          } >> "$GITHUB_STEP_SUMMARY"

          awk -v total="$total" -v threshold="$COVERAGE_THRESHOLD" \
            'BEGIN { if (total + 0 < threshold + 0) exit 1 }'

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-coverage
          path: |
            coverage.out
            coverage.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Smoke-build the CLI
        run: go build -trimpath -o "${{ runner.temp }}/charta" ./cmd/tui-db
