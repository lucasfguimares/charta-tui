version: 2

project_name: charta

builds:
  - id: charta
    main: ./cmd/tui-db
    binary: charta
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/lucasfguimares/tui-db/internal/cli.version={{.Version}}
      - -X github.com/lucasfguimares/tui-db/internal/cli.commit={{.Commit}}
      - -X github.com/lucasfguimares/tui-db/internal/cli.buildDate={{.Date}}

archives:
  - id: charta
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md
      - src: scripts/install.sh
      - src: scripts/install.ps1

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - artifacts: archive

changelog:
  sort: asc
  filters:
    exclude:
      - "^chore"
      - "^ci"
      - "^docs"
      - "^style"
      - "^test"
